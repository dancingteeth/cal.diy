name: Build GHCR image (fork deploy)

# Builds and pushes a runnable web image to GitHub Container Registry for fork testing.
# Does not push to Docker Hub. Trigger manually or on this branch.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - fix/caldav-delete-trailing-slash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_PUBLIC_WEBAPP_URL: https://cal.dancingteeth.net
  DATABASE_URL: postgresql://unicorn_user:magical_password@database:5432/calendso
  NEXTAUTH_SECRET: build-time-placeholder-not-for-prod
  CALENDSO_ENCRYPTION_KEY: buildtimeplaceholderkey32b!!

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=caldav-delete-fix

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ env.NEXT_PUBLIC_WEBAPP_URL }}
            NEXT_PUBLIC_LICENSE_CONSENT=true
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=${{ env.DATABASE_URL }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            CALENDSO_ENCRYPTION_KEY=${{ env.CALENDSO_ENCRYPTION_KEY }}
            MAX_OLD_SPACE_SIZE=8192
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
